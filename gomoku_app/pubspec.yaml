    - assets/spot_diff/bundled_004/
    - assets/spot_diff/bundled_005/
    - assets/spot_diff/bundled_006/
    - assets/spot_diff/bundled_007/
    - assets/spot_diff/bundled_008/
    - assets/spot_diff/bundled_009/
    - assets/spot_diff/bundled_010/
    - assets/spot_diff/bundled_011/
    - assets/spot_diff/bundled_012/
    - assets/spot_diff/bundled_013/
    - assets/spot_diff/bundled_014/
    - assets/spot_diff/bundled_015/
